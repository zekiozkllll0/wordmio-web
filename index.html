.phone.b { right: 4%; top: 70px; transform: rotate(6deg); }

function pick() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  try { const s = localStorage.getItem("lang"); if (s && T[s]) return s; } catch (e) {}
  const n = (navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2));
  return n.find(l => T[l]) || "en";
}
function apply(l) {
  const t = T[l];
  document.documentElement.lang = l;
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(el => {
    const k = el.dataset.i;
    if (k === "h1html") el.innerHTML = t.h1html; else el.textContent = t[k];
  });
  document.querySelectorAll("img[data-shot]").forEach(img => {
    img.src = "img/screens/" + t.shots + "/" + img.dataset.shot + ".jpg";
  });
  document.getElementById("privacy").href = t.privacyHref;
  document.getElementById("lang").value = l;
}
const sel = document.getElementById("lang");
sel.addEventListener("change", () => { try { localStorage.setItem("lang", sel.value); } catch (e) {} apply(sel.value); });
apply(pick());
